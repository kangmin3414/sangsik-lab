}
function write(id, s, x, y, px, col, t, t0, cps = 9, bold = true) { // 글자는 한 자씩 쓰인다(왼쪽부터 드러남). 글자마다 아주 조금 기울고 떠 있다

  X.globalCompositeOperation = 'multiply'; X.fillStyle = INKC[col];
  for (let i = 0; i < s.length && i < n; i++) { const ch = s[i], w = X.measureText(ch).width, rot = (R() - 0.5) * 0.045, dy = (R() - 0.5) * px * 0.035, sc = 1 + (R() - 0.5) * 0.04, part = clamp(n - i);

}
function dashes(id, a, b, col, w, t, t0, n = 10, each = 0.08) { for (let i = 0; i < n; i++) { const u0 = i / n, u1 = u0 + 0.55 / n; stroke(id + i, [[lerp(a[0], b[0], u0), lerp(a[1], b[1], u0)], [lerp(a[0], b[0], u1), lerp(a[1], b[1], u1)]], col, w, t, t0 + i * each, each * 0.8); } }

function stickman(id, x, y, s, t, t0, col = 'k') { // 채널의 막대 사람(작게)
  circle(id + 'h', x, y - 70 * s, 14 * s, 14 * s, col, 6, t, t0, 0.25); stroke(id + 'b', [[x, y - 56 * s], [x, y - 18 * s]], col, 6, t, t0 + 0.25, 0.15);

/* ---------- 그래프의 자리(그림은 대략의 모양) ---------- */
const GX = s => 340 + (s - 2000) / 8000 * 1300, GY = s => s < 7500 ? 380 + 310 * (1 - Math.pow(1 - (s - 2000) / 5500, 2)) : 690;

function cam(t) { const keys = [[0, [760, 420, 1.35]], [T_HARU - 0.4, [960, 520, 1.0]], [T_41 - 0.2, [700, 540, 1.35]], [T_75 - 0.3, [1000, 520, 1.05]], [T_Z - 0.1, [1420, 620, 1.4]], [T_94 + 1.6, [960, 520, 1.0]]];
  let c = keys[0][1]; for (let i = 1; i < keys.length; i++) { const k = easeInOut(K(keys[i][0], keys[i][0] + 1.1, t)); c = c.map((v, j) => lerp(v, keys[i][1][j], k)); } return c; }

  X.beginPath(); X.moveTo(x0, y0); X.lineTo(x0 + w, y0); for (let k = 0; k <= 8; k++) X.lineTo(x0 + w + (R() - 0.5) * 14, y0 + h * k / 8); X.lineTo(x0, y0 + h); for (let k = 8; k >= 0; k--) X.lineTo(x0 + (R() - 0.5) * 14, y0 + h * k / 8); X.closePath();
  X.fillStyle = 'rgba(250,249,245,0.96)'; X.fill(); X.strokeStyle = 'rgba(40,40,40,0.25)'; X.lineWidth = 1; X.stroke(); X.fillStyle = 'rgba(27,28,32,0.8)'; X.textAlign = 'center'; lines.forEach((s, k) => X.fillText(s, W / 2, y0 + 50 + k * 50)); X.textAlign = 'left'; }

  const [cx, cy, z] = cam(t); X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = '#FAF9F5'; X.fillRect(0, 0, W, H);
  X.setTransform(z, 0, 0, z, W / 2 - cx * z, H / 2 - cy * z); X.drawImage(PAPER, -240, -200);
  /* 1: 질문, 쪽 번호, 연구 메모 */
  write('q', '만 보, 꼭 채워야 할까?', 130, 200, 96, 'k', t, 0.25, 12);
  circle('pg', 1780, 140, 36, 36, 'k', 7, t, 0.2, 0.35); write('pgn', '1', 1768, 162, 56, 'k', t, 0.55, 8);
  stickman('m1', 1190, 300, 0.9, t, T_72 - 0.2); stickman('m2', 1260, 300, 0.9, t, T_72 + 0.15); stickman('m3', 1330, 300, 0.9, t, T_72 + 0.5);
  write('n1', '평균 72세 여성', 1400, 250, 50, 'k', t, T_72, 9); write('n2', '16,741명', 1400, 315, 64, 'b', t, T_COUNT, 8); write('n3', '4년 남짓 지켜봄 (2019)', 1400, 372, 40, 'k', t, T_4Y, 10, false);
  /* 2: 축 → 파랑(아는 것) 4,400과 2,700 → 곡선 */
  stroke('ay', [[260, 300], [262, 800]], 'k', 8, t, T_HARU - 0.3, 0.45); stroke('ax', [[255, 800], [1720, 798]], 'k', 8, t, T_HARU + 0.15, 0.6);

  for (const [s, t0] of [[4400, T_4400], [2700, T_2700]]) { stroke('tk' + s, [[GX(s), 784], [GX(s), 816]], 'b', 8, t, t0, 0.15); write('tl' + s, comma(s), GX(s) - 48, 865, 44, 'b', t, t0 + 0.12, 10);
    stroke('dt' + s, [[GX(s) - 4, GY(s)], [GX(s) + 4, GY(s) + 1]], 'b', 22, t, T_2700 + (s === 4400 ? 2.2 : 0.9), 0.1); }
