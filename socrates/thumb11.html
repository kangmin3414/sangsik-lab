<!doctype html>

<body><div id="wrap"><svg id="s" width="1280" height="720" viewBox="0 0 1280 720"></svg><div id="t"></div></div>
<script>

</defs>`;
// a big glossy head (Zero family), centred at 0,0
function head(fill, rim) {
  let h = `<ellipse rx="192" ry="180" fill="url(#${fill})"/>`;
  h += `<g clip-path="url(#headC)"><ellipse cx="-40" cy="200" rx="230" ry="80" fill="#1A1430" opacity=".35" filter="url(#b14)"/><ellipse cx="112" cy="-112" rx="62" ry="24" transform="rotate(28 112 -112)" fill="#fff" opacity=".75" filter="url(#b8)"/></g>`;

}
function qSign(x, y, s, rot) { return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><rect x="-10" y="0" width="20" height="200" rx="8" fill="#7A5235" stroke="${INK}" stroke-width="7"/><circle cx="0" cy="-10" r="92" fill="#FFC94A" stroke="${INK}" stroke-width="10"/><text x="0" y="40" text-anchor="middle" font-family="Jua" font-size="150" fill="#0B1626">?</text></g>`; }

  g += `<path d="M0 650 L1280 620 L1280 720 L0 720 Z" fill="#4A5670" opacity=".6"/>`;
  // Zero: honest face, worried + curious, sweat

  h += `<ellipse cx="0" cy="104" rx="20" ry="24" fill="${INK}"/>`;
  h += `<path d="M168 -78 Q148 -36 168 -16 Q188 -36 168 -78 Z" fill="#9ED8FF" stroke="${INK}" stroke-width="5"/>`;

  g += `<g transform="translate(340 440) rotate(-4)">${h}</g>`;
  // the grinning "아는 척" mask, pulled away in his hand
  g += `<g transform="translate(640 470) rotate(24)"><ellipse rx="128" ry="120" fill="#F4E9D0" stroke="${INK}" stroke-width="10"/><path d="M-62 -30 q22 -24 44 0 M18 -30 q22 -24 44 0" fill="none" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><path d="M-72 22 Q0 110 72 22 Z" fill="${INK}"/><path d="M-50 34 Q0 70 50 34" fill="none" stroke="#fff" stroke-width="6"/>`;
  g += `<g transform="translate(0 -84) rotate(-6)"><rect x="-82" y="-24" width="164" height="48" rx="24" fill="#FF4D4D" stroke="${INK}" stroke-width="6"/><text x="0" y="14" text-anchor="middle" font-family="Jua" font-size="38" fill="#fff">아는 척</text></g></g>`;
  g += `<path d="M470 700 Q560 660 616 590" fill="none" stroke="${INK}" stroke-width="22" stroke-linecap="round"/><circle cx="618" cy="584" r="36" fill="#F2F2F2" stroke="${INK}" stroke-width="8"/>`;

  g += `<g transform="translate(610 190)"><circle cx="-80" cy="100" r="14" fill="#fff" stroke="${INK}" stroke-width="6"/><circle cx="-108" cy="128" r="8" fill="#fff" stroke="${INK}" stroke-width="5"/><ellipse rx="96" ry="80" fill="#fff" stroke="${INK}" stroke-width="9"/><text x="0" y="44" text-anchor="middle" font-family="Jua" font-size="130" fill="#0B1626">?</text></g>`;
} else {
  // ---------- B: Socrates (big) + Zero raising a question sign, Greek dusk ----------
  g += `<rect width="1280" height="720" fill="url(#dusk)"/><rect width="1280" height="720" fill="url(#sun)"/><circle cx="1000" cy="420" r="70" fill="#FFE9B0" opacity=".95"/>`;
  g += `<path d="M0 520 Q300 470 640 500 Q980 460 1280 510 L1280 720 L0 720 Z" fill="#5E5070" opacity=".7"/>`;
  g += `<path d="M560 250 L1300 250 L1300 200 L620 200 Z" fill="#E9E1CF" stroke="${INK}" stroke-width="7"/>`;
  for (const x of [640, 800, 960, 1120, 1260]) g += column(x, 276, 720, 70);
  g += `<rect x="560" y="210" width="760" height="40" fill="#B5523A" stroke="${INK}" stroke-width="7"/>`;
  g += `<rect width="1280" height="720" fill="#2A1E3A" opacity=".18"/>`;
  // Socrates big head: bald crown, white curly fringe + beard, snub nose
  let s = '';

  s += head('headG', '#FFC070');
  // beard: scalloped curls around the jaw
  const bp = [];
  for (let i = 0; i <= 12; i++) { const a = Math.PI * (0.1 + 0.8 * i / 12); bp.push([Math.cos(a) * 176, 60 + Math.sin(a) * 170]); }

  s += `<path d="M-20 52 Q-26 30 0 26 Q26 30 20 52" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><path d="M-12 56 Q0 62 12 56" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round" opacity=".6"/>`;

  g += `<g transform="translate(950 405) rotate(5)">${s}</g>`;
  // Zero, smaller, raising a "?" sign
  let z = head('headW', '#FFC070');
  [-1, 1].forEach(sx => { const cx = 66 * sx - 10; z += `<path d="M${cx - 18} 10 Q${cx} -16 ${cx + 18} 10" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round"/>`; });
  z += `<path d="M-112 -70 Q-76 -96 -32 -96" fill="none" stroke="${INK}" stroke-width="20" stroke-linecap="round"/><path d="M40 -96 Q84 -96 120 -70" fill="none" stroke="${INK}" stroke-width="20" stroke-linecap="round"/><path d="M-40 70 Q0 120 40 70 Z" fill="${INK}"/><ellipse cx="-118" cy="46" rx="26" ry="13" fill="#FF9BB0" opacity=".8"/><ellipse cx="104" cy="46" rx="26" ry="13" fill="#FF9BB0" opacity=".8"/>`;
