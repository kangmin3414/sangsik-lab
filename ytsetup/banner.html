<!doctype html><html><head><meta charset="utf-8"><script src="../shorts/engine.js"></script>

  h += doctor(1650, 912, 0.42, { t: 0.4, expr: '미소' });
  h += Z({ t: 0.4, seed: 3, x: 1890, y: 898, s: 0.52, pose: '손인사', ex: { expr: '신남', prev: '신남', k: 1, blink: 0 }, noBlink: true });

  h += icon(330, 420, 1.2, `<rect x="-110" y="-80" width="220" height="160" rx="18" fill="#0E1A2E" stroke="${MINT}" stroke-width="6"/><path d="M-90 10 Q-60 -60 -30 10 T30 10 T90 10" fill="none" stroke="${MINT}" stroke-width="8"/>`);
  h += icon(330, 1000, 1.1, `<path d="M-90 30 Q-110 -60 -20 -80 Q40 -110 90 -50 Q130 0 90 50 Q40 90 -20 70 Q-80 80 -90 30 Z" fill="#FFB3C1" stroke="${INK}" stroke-width="7"/><path d="M-40 -40 Q0 -10 -20 30 M30 -60 Q50 0 20 40" fill="none" stroke="#E07A90" stroke-width="7"/>`);
  h += icon(2240, 420, 1.2, `<circle r="110" fill="#0E1A2E" stroke="${INK}" stroke-width="8"/><path d="M30 -60 A70 70 0 1 0 50 50 A55 55 0 1 1 30 -60 Z" fill="#FFE9A8"/>`);

  // watermark 300x300 (downscaled to 150): Zero's face on an orange disc
  h += `<circle cx="150" cy="150" r="146" fill="${TEE}" stroke="${INK}" stroke-width="8"/>`;
  h += `<g transform="translate(150 182) scale(0.95) translate(-200 -170)"><ellipse cx="200" cy="170" rx="118" ry="112" fill="#fff" stroke="${INK}" stroke-width="10"/>
  <path d="M149 194 Q165 172 181 194 M219 194 Q235 172 251 194" fill="none" stroke="${INK}" stroke-width="11" stroke-linecap="round"/>
  <path d="M142 140 Q164 126 186 136 M214 136 Q236 126 258 140" fill="none" stroke="${INK}" stroke-width="14" stroke-linecap="round"/>
  <path d="M180 222 Q200 254 220 222 Z" fill="${INK}"/><ellipse cx="148" cy="214" rx="16" ry="8" fill="#FF9BB0"/><ellipse cx="252" cy="214" rx="16" ry="8" fill="#FF9BB0"/></g>`;
}
document.getElementById('v').innerHTML = h;
</script></body></html>
