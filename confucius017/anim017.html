<script>
const W = 1920, H = 1080;
window.TL = window.TL || { duration: 10, lines: [] };
const TEE = '#FF9A55';
// ZERO, new look: no goggles, no vest — a plain orange t-shirt
let STACHE = false, COSTUME = false; // ep.008: Zero wears a topknot + robe while enjoying uselessness
const HALO = g => `<g filter="url(#halo)">${g}</g>`;
const Z = o => HALO(char(Object.assign({ goggles: 'none', vest: TEE, patch: false, tee: true, vshade: 'rgba(150,60,0,0.22)', topknot: false, robe: false }, o)));
// Zhuangzi: white topknot, long white beard, pale green robe; Huizi: black topknot, small beard, blue robe
const ZH = o => HALO(char(Object.assign({ goggles: 'none', vest: '#CFDCC8', patch: false, tee: true, vshade: 'rgba(0,0,0,0.15)', topknot: '#D9D9D9', longBeard: '#F4F4F4', robe: '#4E6E58' }, o)));
const HZ = o => HALO(char(Object.assign({ goggles: 'none', vest: '#9DB8D9', patch: false, tee: true, vshade: 'rgba(0,0,0,0.18)', topknot: '#2B2B2B', pencil: '#2B2B2B', robe: '#3E5C84', guan: true }, o)));
const OF = o => HALO(char(Object.assign({ goggles: 'none', vest: '#D9826B', patch: false, tee: true, vshade: 'rgba(0,0,0,0.18)', topknot: '#2B2B2B', robe: '#8A3A2A', guan: '#5A2A1E' }, o))); // King of Chu's officials
// the three Stoics, same family as Zero
const MA = o => char(Object.assign({ goggles: 'none', vest: '#7A3E8E', patch: false, tee: true, vshade: 'rgba(0,0,0,0.25)', hair: '#6B4A2E', beard: '#6B4A2E', wreath: true, toga: '#F4F1EA', togaStripe: '#7A3E8E' }, o)); // Marcus Aurelius, emperor
const EP = o => char(Object.assign({ goggles: 'none', vest: '#9C7A55', patch: false, tee: true, vshade: 'rgba(0,0,0,0.22)', beard: '#9A9A9A' }, o)); // Epictetus, born a slave
const SE = o => char(Object.assign({ goggles: 'none', vest: '#F2EEE4', patch: false, tee: true, vshade: 'rgba(0,0,0,0.12)', beard: '#B8B8B8', hair: '#B8B8B8', toga: '#F2EEE4', togaStripe: '#C8423A' }, o)); // Seneca, rich advisor
E['화남'] = Object.assign(dotEyes(10, 12), { bL: [138, 140, 163, 156, 188, 168], bR: [212, 168, 237, 156, 262, 140], mouth: 'M184 242 Q200 228 216 242', mouthFill: 'none' });
// Nietzsche himself, same family as Zero: swept hair, walrus moustache, dark coat
const NZ = o => char(Object.assign({ goggles: 'none', vest: '#3B3F4E', patch: false, tee: true, vshade: 'rgba(0,0,0,0.28)', hair: '#5A4130', stache: '#5A4130', noMouth: true, collar: true, tie: '#1E2230' }, o));
// extra expression + poses
E['잠'] = { eyeL: 'M150 190 Q165 202 180 190', eyeR: 'M220 190 Q235 202 250 190', eyeFill: 'none', eyeSW: 8, bL: [142, 158, 164, 154, 186, 158], bR: [214, 158, 236, 154, 258, 158], mouth: 'M192 236 Q200 242 208 236', mouthFill: 'none' };
const LEGS = { legL: P['서기'].legL, legR: P['서기'].legR, fL: P['서기'].fL, fR: P['서기'].fR, dy: 0 };
P['폰보기'] = Object.assign({ armL: [[148, 285], [146, 346], [184, 326]], hL: [188, 322], armR: [[252, 285], [254, 346], [216, 326]], hR: [212, 322] }, LEGS);
P['주머니'] = Object.assign({ armL: [[148, 285], [122, 345], [116, 398]], hL: [114, 406], armR: [[252, 285], [282, 340], [266, 394]], hR: [262, 400] }, LEGS);
P['책상'] = Object.assign({ armL: [[148, 285], [146, 342], [178, 372]], hL: [182, 376], armR: [[252, 285], [258, 342], [228, 372]], hR: [224, 376] }, LEGS);
P['폰넣기'] = Object.assign({ armL: [[148, 285], [122, 345], [116, 398]], hL: [114, 406], armR: [[252, 285], [304, 300], [346, 316]], hR: [352, 318] }, LEGS);
const handG = (x, y, s, h) => [x + (h[0] - 200) * s, y + (h[1] - 560) * s];
const env = t => (TL.env && TL.env[Math.floor(t * 24)]) || 0;

function defs(t) {
  const seed = Math.floor(t * 12) % 60;
  return `<defs>
<clipPath id="headClip"><ellipse cx="200" cy="170" rx="118" ry="112"/></clipPath>
<clipPath id="vestClip"><path d="M142 262 Q200 248 258 262 L270 412 Q200 424 130 412 Z"/></clipPath>
<filter id="boil" x="0" y="0" width="${W}" height="${H}" filterUnits="userSpaceOnUse"><feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="${seed}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<radialGradient id="vig" cx=".5" cy=".5" r=".72"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
<linearGradient id="labG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1626"/><stop offset="1" stop-color="#16294A"/></linearGradient>
<linearGradient id="morning" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD0FF"/><stop offset="1" stop-color="#FFF1D6"/></linearGradient>
<linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B6FB8"/><stop offset=".55" stop-color="#F59A6A"/><stop offset="1" stop-color="#FFD9A0"/></linearGradient>
<linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DB7E0"/><stop offset="1" stop-color="#4E86B8"/></linearGradient>
<linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4EFE4"/><stop offset="1" stop-color="#E9E1D0"/></linearGradient>
<linearGradient id="nightRoom" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151B36"/><stop offset="1" stop-color="#232C52"/></linearGradient>
<linearGradient id="dayRoom" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6EBDD"/><stop offset="1" stop-color="#EBDCC6"/></linearGradient>
<linearGradient id="feedBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1F4A"/><stop offset="1" stop-color="#3E2C63"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${MINT}" stop-opacity=".6"/><stop offset="1" stop-color="${MINT}" stop-opacity="0"/></radialGradient>
<radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".8"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
<radialGradient id="screenGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8FDBFF" stop-opacity=".55"/><stop offset="1" stop-color="#8FDBFF" stop-opacity="0"/></radialGradient>
<radialGradient id="redglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${RED}" stop-opacity=".5"/><stop offset="1" stop-color="${RED}" stop-opacity="0"/></radialGradient>
<radialGradient id="amber" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFB547" stop-opacity=".7"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6F7FF"/><stop offset="1" stop-color="#BFE6FF"/></linearGradient>
<pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0 L0 0 0 60" fill="none" stroke="${MINT}" stroke-opacity=".08" stroke-width="2"/></pattern>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="14" stroke="${INK}" stroke-width="2.4" opacity=".16"/></pattern>
<pattern id="paper" width="200" height="200" patternUnits="userSpaceOnUse"><rect width="200" height="200" fill="none"/><circle cx="30" cy="40" r="1.6" fill="${INK}" opacity=".07"/><circle cx="140" cy="90" r="1.3" fill="${INK}" opacity=".06"/><circle cx="90" cy="160" r="1.8" fill="${INK}" opacity=".05"/></pattern>
<pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="3" fill="#fff" opacity=".07"/></pattern>
<filter id="halo" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/><feFlood flood-color="#FFF8EC" flood-opacity=".9"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="sil" x="-5%" y="-5%" width="110%" height="110%"><feColorMatrix type="matrix" values="0 0 0 0 0.16 0 0 0 0 0.13 0 0 0 0 0.24 0 0 0 1 0"/></filter>
<linearGradient id="autumn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A8494"/><stop offset="1" stop-color="#D9B98E"/></linearGradient>
<linearGradient id="sepia" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9D3A8"/><stop offset="1" stop-color="#F6E7C8"/></linearGradient>
${typeof inkDefs === "function" ? inkDefs() : ""}
<clipPath id="leftHalf"><rect x="-600" y="-600" width="1560" height="2280"/></clipPath>
<clipPath id="rightHalf"><rect x="960" y="-600" width="1560" height="2280"/></clipPath>
<clipPath id="pclip"><rect x="-260" y="-270" width="520" height="460" rx="22"/></clipPath>
<clipPath id="feedClip"><rect x="-52" y="-98" width="104" height="196" rx="14"/></clipPath>
</defs>`;
}
const camT = (cx, cy, z) => `translate(${W / 2} ${H / 2}) scale(${f1(z * 1000) / 1000}) translate(${f1(-cx)} ${f1(-cy)})`;
const flip = (x, inner) => `<g transform="translate(${f1(2 * x)} 0) scale(-1 1)">${inner}</g>`;
const camLerp = (k, A, B) => { k = easeInOut(clamp(k, 0, 1)); return [lerp(A[0], B[0], k), lerp(A[1], B[1], k), lerp(A[2], B[2], k)]; };
const BG = f => `<rect x="-600" y="-600" width="3120" height="2280" fill="${f}"/>`;

/* ---------- shared pieces ---------- */
function label(x, y, text, o = {}) {
  const fs = o.size || 34, w = text.length * fs * 0.92 + 48, h = fs + 28;
  return `<g transform="translate(${x} ${y})"><rect x="${-w / 2 + 5}" y="${-h / 2 + 7}" width="${w}" height="${h}" rx="${h / 2}" fill="${INK}" opacity=".3"/><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${o.bg || MINT}" stroke="${INK}" stroke-width="5"/><text x="0" y="${fs * 0.36}" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="${fs}" fill="${o.color || NAVY}">${esc(text)}</text></g>`;
}
function bubble(x, y, w, h, inner, o = {}) { // thought cloud
  let s = `<g transform="translate(${f1(x)} ${f1(y)})">`;
  const sd = o.right ? -1 : 1; // o.right: the tail trails to the lower right
  s += `<circle cx="${-w * 0.42 * sd}" cy="${h * 0.62}" r="12" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="${-w * 0.52 * sd}" cy="${h * 0.86}" r="7" fill="#fff" stroke="${INK}" stroke-width="4"/>`;
  s += `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${o.bg || '#fff'}" stroke="${INK}" stroke-width="6"/>`;
  return s + inner + `</g>`;
}
function phone(x, y, s, o = {}) {
  let h = `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(o.rot || 0)}) scale(${f1(s * 1000) / 1000})">`;
  if (o.glow) h += `<circle r="300" fill="url(#screenGlow)" opacity="${o.glow}"/>`;
  h += `<rect x="-62" y="-112" width="124" height="224" rx="22" fill="#1F2D44" stroke="${INK}" stroke-width="${o.lw || 7}"/>`;
  if (o.back) {
    h += `<rect x="-46" y="-96" width="40" height="52" rx="12" fill="#121B2B" stroke="#0A0F18" stroke-width="3"/><circle cx="-26" cy="-82" r="9" fill="#0A0F18" stroke="#3A4A66" stroke-width="3"/><circle cx="-26" cy="-58" r="9" fill="#0A0F18" stroke="#3A4A66" stroke-width="3"/>`;
  } else if (o.on) {
    h += `<rect x="-52" y="-98" width="104" height="196" rx="14" fill="url(#screen)"/>`;
    if (o.content) h += `<g clip-path="url(#feedClip)">${o.content}</g>`;
    else for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) h += `<rect x="${-40 + j * 30}" y="${-80 + i * 34}" width="22" height="22" rx="6" fill="${[MINT, PINK, YEL, '#7CC7FF'][(i + j) % 4]}"/>`;
  } else {
    h += `<rect x="-52" y="-98" width="104" height="196" rx="14" fill="#0B0F18"/><path d="M-40 -80 L-10 -80" stroke="#fff" stroke-width="5" opacity=".18" stroke-linecap="round"/>`;
  }
  h += `<rect x="-14" y="-108" width="28" height="7" rx="3.5" fill="#0A0F18"/>`;
  return h + `</g>`;
}
function hand(x, y, s) { return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(22 * s)}" fill="#fff" stroke="${INK}" stroke-width="${f1(7 * s)}"/>`; }
function studyTag(t, lt, text) { return pop(t, t - lt + 0.2, t + 999, 240, 150, label(0, 0, text, { size: 34, bg: YEL }), { rot: -3, bob: 3 }); }

/* ---------- rooms ---------- */
function windowNight(x, y, w, hh, t) {
  let h = `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="12" fill="#0B1430" stroke="${INK}" stroke-width="10"/>`;
  for (let i = 0; i < 14; i++) h += `<circle cx="${x + 30 + (i * 97) % (w - 60)}" cy="${y + 30 + (i * 53) % (hh - 60)}" r="${2 + (i % 3)}" fill="#fff" opacity="${f1((0.4 + 0.5 * Math.abs(Math.sin(t * 1.3 + i))) * 100) / 100}"/>`;
  h += `<circle cx="${x + w * 0.68}" cy="${y + hh * 0.34}" r="44" fill="#FFF2C0"/><circle cx="${x + w * 0.68 + 18}" cy="${y + hh * 0.34 - 10}" r="40" fill="#0B1430"/><circle cx="${x + w * 0.68}" cy="${y + hh * 0.34}" r="140" fill="url(#warm)" opacity=".35"/>`;
  h += `<line x1="${x + w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y + hh}" stroke="${INK}" stroke-width="8"/><line x1="${x}" y1="${y + hh / 2}" x2="${x + w}" y2="${y + hh / 2}" stroke="${INK}" stroke-width="8"/>`;
  h += `<path d="M${x - 40} ${y - 20} Q${x + 30} ${y + hh / 2} ${x - 10} ${y + hh + 40} L${x - 70} ${y + hh + 40} L${x - 70} ${y - 20} Z" fill="#3E4C7A" stroke="${INK}" stroke-width="6"/><path d="M${x + w + 40} ${y - 20} Q${x + w - 30} ${y + hh / 2} ${x + w + 10} ${y + hh + 40} L${x + w + 70} ${y + hh + 40} L${x + w + 70} ${y - 20} Z" fill="#3E4C7A" stroke="${INK}" stroke-width="6"/>`;
  return h;
}
function windowDay(x, y, w, hh, t) {
  let h = `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="12" fill="#A9DBFF" stroke="${INK}" stroke-width="10"/>`;
  h += `<ellipse cx="${x + w * 0.3}" cy="${y + hh * 0.7}" rx="50" ry="18" fill="#fff" opacity=".9"/>`;
  h += `<circle cx="${x + w * 0.75}" cy="${y + hh * 0.3}" r="34" fill="#FFF3B0"/>`;
  h += `<line x1="${x + w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y + hh}" stroke="${INK}" stroke-width="8"/><line x1="${x}" y1="${y + hh / 2}" x2="${x + w}" y2="${y + hh / 2}" stroke="${INK}" stroke-width="8"/>`;
  return h;
}
function bedroom(t, o = {}) {
  const night = o.night !== false;
  let h = BG(night ? 'url(#nightRoom)' : 'url(#dayRoom)') + BG('url(#hatch)').replace('/>', ' opacity=".35"/>');
  h += windowNight(1240, 150, 420, 330, t);
  h += `<rect x="-600" y="880" width="3120" height="600" fill="${night ? '#10152B' : '#C9AE8C'}"/><line x1="-600" y1="880" x2="2520" y2="880" stroke="${INK}" stroke-width="7"/>`;
  // nightstand + clock
  h += `<rect x="1420" y="700" width="230" height="180" rx="10" fill="#5A3E2C" stroke="${INK}" stroke-width="7"/><line x1="1420" y1="780" x2="1650" y2="780" stroke="${INK}" stroke-width="5"/><circle cx="1535" cy="745" r="8" fill="#C9A46A"/>`;
  h += `<rect x="1450" y="626" width="170" height="74" rx="14" fill="#0E0E12" stroke="${INK}" stroke-width="6"/><text x="1535" y="680" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="46" fill="#FF4D4D">${o.clock || '02:00'}</text><rect x="1450" y="626" width="170" height="74" rx="14" fill="#FF4D4D" opacity=".08"/>`;
  // bed
  h += `<rect x="420" y="540" width="920" height="300" rx="34" fill="#3B4A7A" stroke="${INK}" stroke-width="9"/><rect x="450" y="570" width="860" height="40" rx="14" fill="#4E5F96"/>`;
  h += `<rect x="390" y="790" width="980" height="110" rx="26" fill="#E3E8F4" stroke="${INK}" stroke-width="9"/>`;
  return h;
}
function blanket(y0) { return `<path d="M394 ${y0} Q640 ${y0 - 30} 900 ${y0 - 6} Q1140 ${y0 + 14} 1366 ${y0 - 10} L1370 902 L390 902 Z" fill="#5C7AD6" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/><path d="M470 ${y0 + 40} Q700 ${y0 + 20} 900 ${y0 + 40}" fill="none" stroke="#4762B8" stroke-width="7" stroke-linecap="round"/>`; }

function bedScene(t, lt, a) {
  if (a.sleep) return bedSleep(t, lt);
  let h = bedroom(t, { clock: '02:00' });
  if (a.dark) h += BG('#000').replace('/>', ' opacity=".35"/>');
  h += `<ellipse cx="620" cy="770" rx="150" ry="46" fill="#fff" stroke="${INK}" stroke-width="7"/>`; // pillow
  const x = 820, y = 900, s = 0.74;
  h += `<circle cx="${x}" cy="660" r="${a.dark ? 330 : 240}" fill="url(#screenGlow)" opacity="${a.dark ? 1 : 0.8}"/>`;
  const ex = a.notif ? exprAt([[0, '지침'], [0.6, '놀람']], lt) : exprAt([[0, a.dark ? '기본' : '지침']], t);
  h += Z({ t, seed: 3, x, y, s, pose: '폰보기', ex, look: [0, 0.9], light: 1, shade: '#C9D9F0', tilt: a.dark ? 0 : -6 + Math.sin(t * 0.8) * 2 });
  h += blanket(800);
  const [px, py] = handG(x, y, s, [200, 318]);
  h += phone(px, py - 6, 0.42, { on: 1, glow: 0 });
  h += hand(px - 24, py + 8, s) + hand(px + 24, py + 8, s);
  h += `<ellipse cx="${x}" cy="636" rx="92" ry="78" fill="#BFEAFF" opacity="${a.dark ? 0.22 : 0.14}"/>`;
  if (a.notif) {
    const items = [['새 메시지 3', PINK, 1180, 470, -6], ['좋아요 +12', YEL, 520, 430, 5], ['알림 99+', MINT, 1160, 640, 4], ['단톡방 · 읽지 않음', '#7CC7FF', 470, 600, -4]];
    items.forEach(([txt, c, xx, yy, r], i) => {
      const t0 = t - lt + 0.3 + i * 0.5;
      h += pop(t, t0, t + 99, xx, yy, label(0, 0, txt, { size: 34, bg: c }), { rot: r, bob: 4 });
      const k = clamp((t - t0) / 0.6, 0, 1); if (k > 0 && k < 1) h += `<circle cx="${px}" cy="${py}" r="${f1(40 + 160 * k)}" fill="none" stroke="#fff" stroke-width="6" opacity="${f1((1 - k) * 100) / 100}"/>`;
    });
  } else if (a.dark) {
    h += pop(t, t - lt + 0.5, t + 99, 1150, 380, bubble(0, 0, 360, 130, `<circle cx="-110" cy="0" r="34" fill="${YEL}" stroke="${INK}" stroke-width="5"/>${[0, 1, 2, 3, 4, 5, 6, 7].map(i => `<line x1="${f1(-110 + Math.cos(i * 0.785) * 44)}" y1="${f1(Math.sin(i * 0.785) * 44)}" x2="${f1(-110 + Math.cos(i * 0.785) * 58)}" y2="${f1(Math.sin(i * 0.785) * 58)}" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`).join('')}<text x="40" y="14" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="40" fill="${NAVY}">아직 낮인가?</text>`), { rot: 3, bob: 5 });
  } else {
    const k = prog(lt, 0, 4);
    h += pop(t, t - lt + 0.4, t + 99, 1240, 600, label(0, 0, k < 0.5 ? '딱 5분만…' : '…벌써 새벽 2시?', { size: 40, bg: '#fff' }), { rot: -4, bob: 4 });
  }
  return h;
}
function bedSleep(t, lt) {
  let h = bedroom(t, { clock: '23:30' });
  h += BG('#000').replace('/>', ' opacity=".18"/>');
  // phone charging far away on a shelf, screen off
  h += `<rect x="40" y="610" width="260" height="20" rx="6" fill="#5A3E2C" stroke="${INK}" stroke-width="6"/>` + phone(170, 560, 0.36, {}) + `<path d="M170 600 Q170 650 120 700 Q90 740 110 880" fill="none" stroke="#DDE3EE" stroke-width="5"/><circle cx="196" cy="530" r="6" fill="#48E08A"/>`;
