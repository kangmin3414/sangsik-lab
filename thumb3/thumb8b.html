<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/jua/index.css">
<style>
html,body{margin:0;background:#000}
#wrap{position:relative;width:1280px;height:720px;overflow:hidden}
svg{display:block}
#t{position:absolute;left:0;right:0;top:14px;text-align:center;font-family:'Jua',sans-serif;font-size:172px;line-height:1.05;color:#fff;
  -webkit-text-stroke:22px #0E0E10;paint-order:stroke fill;letter-spacing:-1px;
  text-shadow:0 9px 0 rgba(0,0,0,.6),0 0 46px rgba(0,0,0,.7);transform:rotate(-1.2deg)}
#t b{color:#FFC94A;font-weight:normal}
</style></head>
<body><div id="wrap"><svg id="s" width="1280" height="720" viewBox="0 0 1280 720"></svg><div id="t"></div></div>
<script>
const P = new URLSearchParams(location.hash.slice(1));
const TEXT = P.get('text');
if (TEXT) document.getElementById('t').innerHTML = TEXT.replace(/\[(.+?)\]/g, '<b>$1</b>');
let seed = 33;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const INK = '#111114';
const d = `<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="720" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#05040C"/><stop offset=".45" stop-color="#1B1430"/><stop offset=".8" stop-color="#3A2448"/><stop offset="1" stop-color="#5A3050"/></linearGradient>
<radialGradient id="sun" cx="980" cy="470" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".95"/><stop offset=".18" stop-color="#FFB547" stop-opacity=".6"/><stop offset=".5" stop-color="#E0642E" stop-opacity=".22"/><stop offset="1" stop-color="#E0642E" stop-opacity="0"/></radialGradient>
<radialGradient id="headG" cx=".82" cy=".38" r=".98"><stop offset="0" stop-color="#FFF6E6"/><stop offset=".34" stop-color="#F2E2CC"/><stop offset=".7" stop-color="#9C8C9C"/><stop offset="1" stop-color="#3A3550"/></radialGradient>
<radialGradient id="handG" cx=".8" cy=".35" r=".9"><stop offset="0" stop-color="#FFF6E6"/><stop offset=".55" stop-color="#E6CFB8"/><stop offset="1" stop-color="#6A5A70"/></radialGradient>
<linearGradient id="teeG" x1="150" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4A200E"/><stop offset=".55" stop-color="#B05A28"/><stop offset="1" stop-color="#FF9A55"/></linearGradient>
<linearGradient id="stacheG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A1A12"/><stop offset=".6" stop-color="#4A3020"/><stop offset="1" stop-color="#7A5236"/></linearGradient>
<linearGradient id="mtnA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3550"/><stop offset="1" stop-color="#1A1830"/></linearGradient>
<linearGradient id="mtnB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E1A2E"/><stop offset="1" stop-color="#0A0912"/></linearGradient>
<radialGradient id="vig" cx="640" cy="430" r="820" gradientUnits="userSpaceOnUse"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".78"/></radialGradient>
<linearGradient id="topDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".65"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
<filter id="b1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
<filter id="b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="b8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="b14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="b24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .5"/></feComponentTransfer></filter>
<clipPath id="headC"><ellipse rx="192" ry="180"/></clipPath>
<mask id="rimR" maskContentUnits="userSpaceOnUse"><rect x="-260" y="-260" width="520" height="520" fill="#000"/><ellipse rx="192" ry="180" fill="#fff"/><ellipse cx="-24" cy="8" rx="192" ry="180" fill="#000" filter="url(#b4)"/></mask>
<clipPath id="teeC"><path id="teeP" d="M150 760 L172 670 Q192 614 272 598 Q372 584 472 598 Q542 612 568 662 L604 760 Z"/></clipPath>
</defs>`;
let g = '';
g += `<rect width="1280" height="720" fill="url(#sky)"/>`;
// cloud of question marks
for (let i = 0; i < 26; i++) { const x = 40 + rnd() * 1200, y = 200 + rnd() * 500, s = 40 + rnd() * 70, r = (rnd() - .5) * 50; g += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-family="Jua, sans-serif" font-size="${s.toFixed(0)}" fill="#8F86C8" opacity="${(.18 + rnd() * .3).toFixed(2)}" transform="rotate(${r.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" ${rnd() < .4 ? 'filter="url(#b4)"' : ''}>?</text>`; }
// candle glow on the right
g += `<rect width="1280" height="720" fill="url(#sun)" opacity=".75"/>`;
// fake-news card + AI face card floating on the right
const card = (x, y, r, inner) => `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-150" y="-110" width="300" height="220" rx="18" fill="#000" opacity=".45" filter="url(#b8)" transform="translate(10 14)"/><rect x="-150" y="-110" width="300" height="220" rx="18" fill="#F4F1EA" stroke="${INK}" stroke-width="7"/>${inner}</g>`;
g += card(1090, 300, 8, `<rect x="-128" y="-90" width="256" height="100" rx="10" fill="#C7D2E6"/><path d="M-60 10 Q-60 -40 0 -40 Q60 -40 60 10 Z" fill="#7CC7FF" stroke="${INK}" stroke-width="4"/><ellipse cx="0" cy="-58" rx="30" ry="34" fill="#F2D3B6" stroke="${INK}" stroke-width="4"/><line x1="-120" y1="40" x2="110" y2="40" stroke="#9AA6B2" stroke-width="10" stroke-linecap="round"/><line x1="-120" y1="72" x2="60" y2="72" stroke="#C3CDD8" stroke-width="10" stroke-linecap="round"/><g transform="translate(70 -40) rotate(-14)"><rect x="-74" y="-30" width="148" height="60" rx="8" fill="none" stroke="#FF4D4D" stroke-width="8"/><text x="0" y="14" text-anchor="middle" font-family="Jua, sans-serif" font-size="40" fill="#FF4D4D">AI?</text></g>`);
g += card(930, 560, -9, `<text x="-120" y="-50" font-family="Jua, sans-serif" font-size="40" fill="#FF4D4D">[속보] 충격!!</text><line x1="-120" y1="0" x2="120" y2="0" stroke="#9AA6B2" stroke-width="10" stroke-linecap="round"/><line x1="-120" y1="34" x2="80" y2="34" stroke="#C3CDD8" stroke-width="10" stroke-linecap="round"/><g transform="translate(60 60) rotate(-12)"><rect x="-80" y="-30" width="160" height="60" rx="8" fill="none" stroke="#FF4D4D" stroke-width="8"/><text x="0" y="14" text-anchor="middle" font-family="Jua, sans-serif" font-size="40" fill="#FF4D4D">가짜?</text></g>`);
// candle
g += `<g transform="translate(1180 690)"><circle cx="0" cy="-150" r="120" fill="#FFB547" opacity=".35" filter="url(#b24)"/><rect x="-24" y="-110" width="48" height="110" rx="8" fill="#FFF3D6" stroke="${INK}" stroke-width="6"/><path d="M0 -190 Q22 -140 0 -114 Q-22 -140 0 -190 Z" fill="#FFB547" stroke="${INK}" stroke-width="5"/></g>`;

// ---------- ZERO in a baroque wig + white collar ----------
g += `<use href="#teeP" fill="url(#teeG)"/>`;
g += `<g clip-path="url(#teeC)"><ellipse cx="370" cy="604" rx="170" ry="34" fill="#000" opacity=".45" filter="url(#b8)"/></g>`;
g += `<use href="#teeP" fill="none" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/><path d="M300 600 Q372 640 444 600" fill="none" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`;
let h = '';
// wig curls behind the head
const curl = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#6B4A2E" stroke="${INK}" stroke-width="7"/><path d="M${x - r * .5} ${y - r * .1} q${r * .5} -${r * .5} ${r} 0" fill="none" stroke="#8C6440" stroke-width="5" opacity=".8"/>`;
h += `<ellipse rx="192" ry="180" fill="url(#headG)"/>`;
h += `<g clip-path="url(#headC)"><ellipse cx="-40" cy="200" rx="230" ry="80" fill="#1A1430" opacity=".5" filter="url(#b14)"/><ellipse cx="-175" cy="0" rx="80" ry="200" fill="#0A0814" opacity=".55" filter="url(#b24)"/><ellipse cx="112" cy="-112" rx="62" ry="24" transform="rotate(28 112 -112)" fill="#fff" opacity=".75" filter="url(#b8)"/></g>`;
h += `<ellipse rx="192" ry="180" fill="#FFB060" mask="url(#rimR)" opacity=".9"/>`;
h += `<ellipse rx="192" ry="180" fill="none" stroke="${INK}" stroke-width="10"/>`;
// wig cap
// skeptical face: left eye squints, right eye big behind a magnifier
h += `<path d="M-100 20 Q-64 6 -30 20" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round"/>`;
h += `<path d="M-128 -38 Q-84 -30 -34 -30" fill="none" stroke="${INK}" stroke-width="22" stroke-linecap="round"/><path d="M34 -66 Q84 -96 132 -74" fill="none" stroke="${INK}" stroke-width="22" stroke-linecap="round"/>`;
h += `<path d="M-34 108 Q0 98 34 112" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`;
h += `<ellipse cx="-112" cy="76" rx="26" ry="11" fill="#FF8A7A" opacity=".35"/>`;
g += `<g transform="translate(400 390) rotate(-4)">${h}</g>`;
// magnifier over the right eye (eye enlarged)
g += `<g transform="translate(480 400)"><rect x="70" y="80" width="40" height="190" rx="16" transform="rotate(-38 90 175)" fill="#7A5235" stroke="${INK}" stroke-width="8"/><circle r="104" fill="#DFF4FF" fill-opacity=".35" stroke="${INK}" stroke-width="16"/><circle r="104" fill="none" stroke="#C9A04A" stroke-width="8"/><circle cx="-6" cy="4" r="40" fill="#fff" stroke="${INK}" stroke-width="7"/><circle cx="-2" cy="8" r="22" fill="${INK}"/><circle cx="6" cy="-2" r="7" fill="#fff"/><path d="M-60 -60 Q-30 -84 6 -80" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".7"/></g>`;
// hand holding the magnifier
g += `<ellipse cx="620" cy="600" rx="44" ry="40" fill="url(#handG)" stroke="${INK}" stroke-width="8"/>`;
g += `<rect width="1280" height="240" fill="url(#topDark)"/>`;
g += `<rect width="1280" height="720" fill="url(#vig)"/>`;
g += `<rect width="1280" height="720" filter="url(#grain)" opacity=".15" style="mix-blend-mode:overlay"/>`;
document.getElementById('s').innerHTML = d + g;
</script>
</body></html>
