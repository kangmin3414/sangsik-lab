<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/jua/index.css">
<style>
html,body{margin:0;background:#000}
#wrap{position:relative;width:1280px;height:720px;overflow:hidden}
svg{display:block}
#t{position:absolute;left:0;right:0;top:14px;text-align:center;font-family:'Jua',sans-serif;font-size:172px;line-height:1.05;color:#fff;
  -webkit-text-stroke:22px #0E0E10;paint-order:stroke fill;letter-spacing:-1px;
  text-shadow:0 9px 0 rgba(0,0,0,.6),0 0 46px rgba(0,0,0,.7);transform:rotate(-1.2deg)}
#t b{color:#FFC94A;font-weight:normal}
</style></head>
<body><div id="wrap"><svg id="s" width="1280" height="720" viewBox="0 0 1280 720"></svg><div id="t"></div></div>
<script>
const P = new URLSearchParams(location.hash.slice(1));
const TEXT = P.get('text');
if (TEXT) document.getElementById('t').innerHTML = TEXT.replace(/\[(.+?)\]/g, '<b>$1</b>');
let seed = 33;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const INK = '#111114';
const d = `<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="720" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#03050C"/><stop offset=".38" stop-color="#121A33"/><stop offset=".62" stop-color="#5A2E2A"/><stop offset=".78" stop-color="#C8642E"/><stop offset="1" stop-color="#F2A04A"/></linearGradient>
<radialGradient id="sun" cx="1010" cy="500" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".95"/><stop offset=".18" stop-color="#FFB547" stop-opacity=".6"/><stop offset=".5" stop-color="#E0642E" stop-opacity=".22"/><stop offset="1" stop-color="#E0642E" stop-opacity="0"/></radialGradient>
<radialGradient id="headG" cx=".82" cy=".38" r=".98"><stop offset="0" stop-color="#FFF6E6"/><stop offset=".34" stop-color="#F2E2CC"/><stop offset=".7" stop-color="#9C8C9C"/><stop offset="1" stop-color="#3A3550"/></radialGradient>
<radialGradient id="handG" cx=".8" cy=".35" r=".9"><stop offset="0" stop-color="#FFF6E6"/><stop offset=".55" stop-color="#E6CFB8"/><stop offset="1" stop-color="#6A5A70"/></radialGradient>
<linearGradient id="teeG" x1="150" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4A200E"/><stop offset=".55" stop-color="#B05A28"/><stop offset="1" stop-color="#FF9A55"/></linearGradient>
<linearGradient id="stacheG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A1A12"/><stop offset=".6" stop-color="#4A3020"/><stop offset="1" stop-color="#7A5236"/></linearGradient>
<linearGradient id="mtnA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3550"/><stop offset="1" stop-color="#1A1830"/></linearGradient>
<linearGradient id="mtnB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E1A2E"/><stop offset="1" stop-color="#0A0912"/></linearGradient>
<radialGradient id="vig" cx="640" cy="430" r="820" gradientUnits="userSpaceOnUse"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".78"/></radialGradient>
<linearGradient id="topDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".65"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
<filter id="b1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
<filter id="b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="b8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="b14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="b24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .5"/></feComponentTransfer></filter>
<clipPath id="headC"><ellipse rx="192" ry="180"/></clipPath>
<mask id="rimR" maskContentUnits="userSpaceOnUse"><rect x="-260" y="-260" width="520" height="520" fill="#000"/><ellipse rx="192" ry="180" fill="#fff"/><ellipse cx="-24" cy="8" rx="192" ry="180" fill="#000" filter="url(#b4)"/></mask>
<clipPath id="teeC"><path id="teeP" d="M150 760 L172 670 Q192 614 272 598 Q372 584 472 598 Q542 612 568 662 L604 760 Z"/></clipPath>
</defs>`;
let g = '';
g += `<rect width="1280" height="720" fill="url(#sky)"/>`;
// storm clouds + rain on the left (chaos)
for (let i = 0; i < 14; i++) { const x = rnd() * 760, y = 120 + rnd() * 260, r = 70 + rnd() * 90; g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#1A2238" opacity=".85"/>`; }
for (let i = 0; i < 70; i++) { const x = rnd() * 820, y = rnd() * 720; g += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x - 14).toFixed(1)}" y2="${(y + 44).toFixed(1)}" stroke="#9FB8E0" stroke-width="2.2" opacity="${(.25 + rnd() * .35).toFixed(2)}"/>`; }
g += `<path d="M150 150 L200 280 L170 284 L230 420 L150 300 L184 296 L120 150 Z" fill="#FFF6C8" stroke="#FFE27A" stroke-width="4" filter="url(#b1)"/><path d="M150 150 L200 280 L170 284 L230 420" stroke="#fff" stroke-width="20" opacity=".25" filter="url(#b8)" fill="none"/>`;
// warm light from the right
g += `<rect width="1280" height="720" fill="url(#sun)"/>`;
// marble columns (right), lit gold
const col = (x, w) => { let c = `<rect x="${x - w / 2}" y="170" width="${w}" height="560" fill="#D8CBB0" stroke="${INK}" stroke-width="6"/>`; for (let i = 1; i < 4; i++) c += `<line x1="${x - w / 2 + i * w / 4}" y1="180" x2="${x - w / 2 + i * w / 4}" y2="720" stroke="#B7A786" stroke-width="4"/>`; c += `<rect x="${x - w / 2 - 16}" y="146" width="${w + 32}" height="28" rx="4" fill="#E6DAC0" stroke="${INK}" stroke-width="6"/>`; return c; };
g += `<g opacity=".9">` + col(900, 86) + col(1080, 86) + col(1250, 86) + `</g><rect x="820" y="110" width="520" height="40" fill="#E6DAC0" stroke="${INK}" stroke-width="6"/>`;
g += `<rect x="800" y="140" width="480" height="580" fill="#000" opacity=".22" filter="url(#b24)"/>`;
// papers and notifications whirling in the storm (chaos around a calm face)
[[90, 520, -24, '!'], [700, 250, 18, '?'], [640, 560, -12, '!!'], [60, 330, 30, ''], [720, 420, -30, '']].forEach(([x, y, r, txt]) => { g += `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-38" y="-48" width="76" height="96" rx="6" fill="#F4F1EA" stroke="${INK}" stroke-width="5"/>${txt ? `<text x="0" y="16" text-anchor="middle" font-family="Jua, sans-serif" font-size="48" fill="#FF4D4D">${txt}</text>` : '<line x1="-22" y1="-20" x2="22" y2="-20" stroke="#B8B0A4" stroke-width="5"/><line x1="-22" y1="0" x2="16" y2="0" stroke="#B8B0A4" stroke-width="5"/><line x1="-22" y1="20" x2="22" y2="20" stroke="#B8B0A4" stroke-width="5"/>'}</g><path d="M${x - 70} ${y + 30} q30 -10 60 0" stroke="#CFE0FF" stroke-width="4" fill="none" opacity=".6" transform="rotate(${r} ${x} ${y})"/>`; });

// ---------- ZERO (plain orange tee, v3) ----------
g += `<use href="#teeP" fill="url(#teeG)"/>`;
g += `<g clip-path="url(#teeC)"><path d="M560 640 L604 760" stroke="#FFC98A" stroke-width="18" opacity=".55" filter="url(#b4)"/><ellipse cx="370" cy="604" rx="170" ry="34" fill="#000" opacity=".45" filter="url(#b8)"/></g>`;
g += `<use href="#teeP" fill="none" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/>`;
g += `<path d="M300 612 Q372 638 444 612" fill="none" stroke="${INK}" stroke-width="16" stroke-linecap="round"/><path d="M300 612 Q372 638 444 612" fill="none" stroke="#7A3A1A" stroke-width="7" stroke-linecap="round"/>`;

// head
let h = '';
h += `<ellipse rx="192" ry="180" fill="url(#headG)"/>`;
h += `<g clip-path="url(#headC)">
  <ellipse cx="-40" cy="200" rx="230" ry="80" fill="#1A1430" opacity=".5" filter="url(#b14)"/>
  <ellipse cx="-175" cy="0" rx="80" ry="200" fill="#0A0814" opacity=".55" filter="url(#b24)"/>
  <ellipse cx="112" cy="-112" rx="62" ry="24" transform="rotate(28 112 -112)" fill="#fff" opacity=".75" filter="url(#b8)"/>
</g>`;
h += `<ellipse rx="192" ry="180" fill="#FFB060" mask="url(#rimR)" opacity=".95"/>`;
h += `<path d="M134 -132 Q160 -104 170 -66" fill="none" stroke="#FFF4E0" stroke-width="7" stroke-linecap="round" opacity=".9"/>`;
h += `<ellipse rx="192" ry="180" fill="none" stroke="${INK}" stroke-width="10"/>`;
// serene closed eyes + soft brows + small smile
[-1, 1].forEach(sx => { const cx = 64 * sx; h += `<path d="M${cx - 30} 22 Q${cx} 44 ${cx + 30} 22" fill="none" stroke="${INK}" stroke-width="11" stroke-linecap="round"/>`; });
h += `<path d="M-126 -36 Q-84 -50 -34 -42" fill="none" stroke="${INK}" stroke-width="22" stroke-linecap="round"/><path d="M34 -42 Q84 -50 126 -36" fill="none" stroke="${INK}" stroke-width="22" stroke-linecap="round"/>`;
h += `<path d="M-30 104 Q0 124 30 104" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>`;
h += `<ellipse cx="-112" cy="76" rx="26" ry="11" fill="#FF8A7A" opacity=".45"/><ellipse cx="116" cy="72" rx="26" ry="11" fill="#FF8A7A" opacity=".55"/>`;
// laurel wreath
const leafRow = (x0, y0, cx, cy, x1, y1, side) => { let w = ''; for (let i = 0; i < 8; i++) { const k = 0.05 + i * 0.13, q = 1 - k; const px = q * q * x0 + 2 * q * k * cx + k * k * x1, py = q * q * y0 + 2 * q * k * cy + k * k * y1; const tx = 2 * q * (cx - x0) + 2 * k * (x1 - cx), ty = 2 * q * (cy - y0) + 2 * k * (y1 - cy); const ang = Math.atan2(ty, tx) * 180 / Math.PI; for (const sg of [-1, 1]) w += `<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="30" ry="13" transform="rotate(${(ang + sg * 38 * side).toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)}) translate(${20 * side} 0)" fill="${sg > 0 ? '#7CC95E' : '#4E9A3E'}" stroke="${INK}" stroke-width="5"/>`; } return w; };
// v3: no wreath — Zero never wears a costume
g += `<g transform="translate(410 400) rotate(-4)">${h}</g>`;
// calm aura
g += `<ellipse cx="410" cy="400" rx="260" ry="250" fill="none" stroke="#FFE2A8" stroke-width="5" opacity=".35" filter="url(#b4)"/>`;
// grade
g += `<rect width="1280" height="240" fill="url(#topDark)"/>`;
g += `<rect width="1280" height="720" fill="url(#vig)"/>`;
g += `<rect width="1280" height="720" filter="url(#grain)" opacity=".15" style="mix-blend-mode:overlay"/>`;
document.getElementById('s').innerHTML = d + g;
</script>
</body></html>
