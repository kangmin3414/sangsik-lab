    const alert = t > 54.2;
    const v = t < 53.8 ? 10 : lerp(10, 5, easeInOut(prog(t, 53.8, 55.2)));
    const fl = easeInOut(prog(t, 55.0, 57.0)) * 260;
    let zx = t < 52.4 ? 380 : lerp(380, 560, prog(t, 52.4, 53.0)), zy = 1390 - fl, pose, sxq = 1, syq = 1;
    if (t < 52.4) pose = '서기'; else if (t < 53.0) pose = walkPose(t * 10, 0.7);
    else pose = poseAt([[53.0, '서기'], [53.2, '손인사'], [54.2, '서기'], [55.0, '허우적']], t, 0.25);
    if (t > 53.0 && t < 53.2) { const k = prog(t, 53.0, 53.2); syq = lerp(0.88, 1, k); sxq = lerp(1.1, 1, k); }
    if (t > 55.0) pose = mixPose('허우적', '둥둥', (Math.sin(t * 6) + 1) / 2);
    cam = t < 54.2 ? [560, 1060, 1.0] : camLerp(t, 54.2, 57, [560, 1060, 1.0], [560, zy - 400, 1.55]);
    scene += labBG(t, { alert }) + platform(560, 1440, 0.3, t);
    scene += scale(560, 1420, v.toFixed(1) + 'kg', alert ? RED : YEL);
    scene += doctor(170, 1560, 0.5, { t, glass: alert ? RED : MINT, shake: alert, expr: alert ? (t > 55.2 ? '당황' : '놀람') : '기본', talk: (t > 51.6 && t < 52.6) || (t > 55.2 && t < 56.6) });
    scene += shadow(zx, 1410, 80 - fl * 0.2);
    scene += char({ t, seed: 13, x: zx, y: zy, s: 0.72, sx: sxq, sy: syq, pose, ex: exprAt([[0, '기본'], [53.0, '신남'], [54.2, '놀람'], [54.6, '겁먹음']], t), shiver: alert, look: alert ? [0, 0.6] : [0, 0], light: -1, shade: alert ? '#F2B9B9' : '#D5E2EE' });
    if (alert) { const k = (Math.sin(t * 12) + 1) / 2; alertTint = 0.1 + k * 0.18; scene += `<circle cx="540" cy="360" r="340" fill="url(#redglow)" opacity="${f1(k * 100) / 100}"/>`; }
    const g = t < 54.2 ? 0.17 : lerp(0.17, 0.08, prog(t, 54.2, 55.4));
    hv = { g: g.toFixed(2) + ' G', gc: alert ? RED : MINT, w: v.toFixed(1) + ' kg', wc: alert ? RED : MINT, d: '7일차', t };
    over += drBox(t, 51.6, 53.6, ['실험 종료. 중력 복구.'], { y: 700 });
    over += cap(t, 53.0, 54.2, ['휴, 이제 끝…?']);
    over += fx(t, 54.3, 57.0, 300, 560, '삐- 삐-', RED, { size: 96, rot: -8, wobble: 5 });
    over += drBox(t, 55.2, 57.0, ['저는… 설정값을 바꾼 적이', '없습니다.'], { border: RED, shake: true, y: 1300 });
  } else {
    scene += `<rect x="-300" y="-300" width="1680" height="2520" fill="${NAVY}"/><rect x="-300" y="-300" width="1680" height="2520" fill="url(#grid)"/>`;
    scene += particles(t, 40, 30, [100, 300, 880, 1300], MINT, { speed: 50, r: 4, op: 0.8 });
    const b = Math.sin(t * 3) * 14;
    scene += char({ t, seed: 14, x: 540, y: 1080 + b, s: 0.5, pose: mixPose('둥둥', '허우적', (Math.sin(t * 4) + 1) / 2), ex: { expr: '겁먹음', prev: '겁먹음', k: 1, blink: 0 }, goggles: 'down', rot: Math.sin(t * 1.7) * 8 });
    cam = camLerp(t, 57, 60, [540, 960, 1.0], [540, 960, 1.06]);
    over += pop(t, 57.0, 60.1, 540, 430, outlined(0, 0, [[['실험 001 · ', MINT], ['2부', YEL]]], { size: 70, sw: 14 }), {});
    over += pop(t, 57.2, 60.1, 540, 1260, outlined(0, 0, ['중력이 매일', [['절반씩', YEL], [' 줄어든다면?', WHITE]]], { size: 92, sw: 18 }), {});
    over += pop(t, 57.8, 60.1, 540, 1530, `<rect x="-400" y="-56" width="800" height="104" rx="52" fill="${MINT}" stroke="${INK}" stroke-width="6"/><text x="0" y="16" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="46" fill="${NAVY}">다음 실험은 댓글로 의뢰하세요</text>`, {});
  }

  const fadeIn = 1 - prog(t, 0, 0.25);
  document.getElementById('v').innerHTML = defs(t) +
    `<g filter="url(#boil)"><g transform="translate(${f1(sx)} ${f1(sy)}) ${camT(cam[0], cam[1], cam[2])}">${scene}</g></g>` +
    (alertTint ? `<rect width="1080" height="1920" fill="${RED}" opacity="${f1(alertTint * 100) / 100}"/>` : '') +
    `<rect width="1080" height="1920" fill="url(#vig)"/>` +
    `<rect width="1080" height="1920" filter="url(#grain)" opacity=".07" style="mix-blend-mode:overlay"/>` +
    (t < 57 ? hud(hv) : '') + over +
    `<text x="1040" y="1880" text-anchor="end" font-family="${FONT}" font-weight="700" font-size="28" fill="#fff" opacity=".55">만약에연구소</text>` +
    `<rect width="1080" height="1920" fill="#000" opacity="${f1(fadeIn * 100) / 100}"/>`;
}
window.render = render;
render(0);
</script>
</body>
</html>
