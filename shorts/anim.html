<body>
<svg id="v" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const FONT = "'Noto Sans CJK KR', sans-serif";
const MONO = "'DejaVu Sans Mono', monospace";
const INK = '#141414', NAVY = '#0B1626', MINT = '#3DF2B0', YEL = '#F7E733', PINK = '#FF5FA2', RED = '#FF4D4D', WHITE = '#FFFFFF';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const easeInOut = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ---------- ZERO (same geometry as the canvas component) ---------- */
const ell = (cx, cy, rx, ry) => `M${cx - rx} ${cy} A${rx} ${ry} 0 1 0 ${cx + rx} ${cy} A${rx} ${ry} 0 1 0 ${cx - rx} ${cy} Z`;
const dot = (rx, ry) => ({ eyeL: ell(165, 188, rx, ry), eyeR: ell(235, 188, rx, ry), eyeFill: INK, eyeSW: 0 });
const E = {

  '놀람': { eyeL: ell(165, 190, 9, 10), eyeR: ell(235, 190, 9, 10), eyeFill: INK, eyeSW: 0, whites: true, browL: 'M140 136 Q163 118 186 128', browR: 'M214 128 Q237 118 260 136', mouth: ell(200, 238, 10, 14), mouthFill: INK },
  '결심': Object.assign(dot(10, 12), { browL: 'M138 148 L188 166', browR: 'M212 166 L262 148', mouth: 'M188 234 L212 234', mouthFill: 'none' }),

  '지침': { eyeL: 'M152 184 L178 184 Q178 200 165 200 Q152 200 152 184 Z', eyeR: 'M222 184 L248 184 Q248 200 235 200 Q222 200 222 184 Z', eyeFill: INK, eyeSW: 0, browL: 'M142 166 L186 170', browR: 'M214 170 L258 166', mouth: 'M190 236 L210 233', mouthFill: 'none' },

const P = {

  '손인사': { armL: '148,285 122,345 116,398', hL: [114, 406], armR: '252,285 302,245 320,180', hR: [322, 170], legL: '180,412 176,470 172,522', fL: [160, 534, 0], legR: '220,412 224,470 228,522', fR: [240, 534, 0], dy: 0 },
  '걷기1': { armL: '148,285 128,340 152,390', hL: [156, 398], armR: '252,285 282,338 298,386', hR: [302, 394], legL: '180,412 160,466 138,512', fL: [126, 524, -15], legR: '220,412 230,470 240,522', fR: [252, 534, 0], dy: 0 },
  '걷기2': { armL: '148,285 118,338 102,386', hL: [98, 394], armR: '252,285 272,340 248,390', hR: [244, 398], legL: '180,412 172,468 160,520', fL: [148, 532, -8], legR: '220,412 240,466 262,512', fR: [274, 524, 15], dy: 0 },
  '둥둥': { armL: '148,285 100,300 72,270', hL: [66, 262], armR: '252,285 300,300 328,270', hR: [334, 262], legL: '180,412 172,468 160,514', fL: [150, 526, 20], legR: '220,412 228,468 240,514', fR: [250, 526, -20], dy: 0 },
  '점프': { armL: '148,285 104,230 86,170', hL: [82, 160], armR: '252,285 296,230 314,170', hR: [318, 160], legL: '180,412 140,450 168,494', fL: [160, 504, 0], legR: '220,412 262,448 236,494', fR: [244, 504, 0], dy: 0 },
  '웅크림': { armL: '148,285 128,340 160,372', hL: [166, 378], armR: '252,285 272,340 240,372', hR: [234, 378], legL: '180,412 146,452 166,492', fL: [160, 504, 0], legR: '220,412 254,452 234,492', fR: [240, 504, 0], dy: 30 },
  '미끄럼': { armL: '148,285 96,240 70,190', hL: [66, 180], armR: '252,285 304,236 334,200', hR: [340, 192], legL: '180,412 214,462 262,488', fL: [276, 494, -30], legR: '220,412 262,452 312,466', fR: [326, 470, -30], dy: 0 },
  '납작': { armL: '148,285 92,262 52,230', hL: [44, 222], armR: '252,285 308,262 348,230', hR: [356, 222], legL: '180,412 150,470 120,520', fL: [108, 532, 0], legR: '220,412 250,470 280,520', fR: [292, 532, 0], dy: 0 }
};
function zero(o) {
  const e = E[o.expr || '기본'], p = P[o.pose || '서기'];
  const s = o.s || 1, sx = o.sx || 1, sy = o.sy || 1, rot = o.rot || 0;
  const vest = o.vest || YEL, gog = o.goggles || 'up';
  const down = gog === 'down';
  let h = `<g transform="translate(${o.x} ${o.y}) rotate(${rot}) scale(${s * sx} ${s * sy}) translate(-200 -560)">`;
  h += `<g transform="translate(0 ${p.dy})">`;
  h += `<g stroke="${INK}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"><polyline points="${p.legL}"/><polyline points="${p.legR}"/></g>`;
  h += `<ellipse cx="${p.fL[0]}" cy="${p.fL[1]}" rx="27" ry="14" fill="#fff" stroke="${INK}" stroke-width="7" transform="rotate(${p.fL[2]} ${p.fL[0]} ${p.fL[1]})"/>`;
  h += `<ellipse cx="${p.fR[0]}" cy="${p.fR[1]}" rx="27" ry="14" fill="#fff" stroke="${INK}" stroke-width="7" transform="rotate(${p.fR[2]} ${p.fR[0]} ${p.fR[1]})"/>`;
  h += `<path d="M142 262 Q200 248 258 262 L270 412 Q200 424 130 412 Z" fill="${vest}" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>`;
  if (o.tie) h += `<path d="M200 262 L190 290 L200 360 L210 290 Z" fill="${o.tie}" stroke="${INK}" stroke-width="4"/>`;
  if (o.patch !== false) {
    h += `<line x1="200" y1="256" x2="200" y2="416" stroke="${INK}" stroke-width="4"/>`;
    h += `<rect x="148" y="298" width="40" height="26" rx="5" fill="#1F2D44"/><text x="168" y="318" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="18" fill="${MINT}">00</text>`;
  }
  h += `<g stroke="${INK}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"><polyline points="${p.armL}"/><polyline points="${p.armR}"/></g>`;
  const hx = o.headSx || 1;
  h += `<ellipse cx="200" cy="170" rx="${118 * hx}" ry="112" fill="#fff" stroke="${INK}" stroke-width="8"/>`;
  if (o.hair) h += `<path d="M86 152 Q84 62 200 58 Q316 62 314 152 Q296 112 250 104 Q200 120 150 104 Q104 112 86 152 Z" fill="${o.hair}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>`;
  if (o.puffy) h += `<ellipse cx="200" cy="170" rx="${118 * 1.12}" ry="116" fill="#fff" stroke="${INK}" stroke-width="8"/>`;
  if (e.blush) h += `<ellipse cx="148" cy="212" rx="15" ry="8" fill="#FF9BB0" opacity=".8"/><ellipse cx="252" cy="212" rx="15" ry="8" fill="#FF9BB0" opacity=".8"/>`;
  if (e.whites) h += `<circle cx="165" cy="188" r="25" fill="#fff" stroke="${INK}" stroke-width="6"/><circle cx="235" cy="188" r="25" fill="#fff" stroke="${INK}" stroke-width="6"/>`;
  const shiver = o.shiver ? Math.sin(o.shiver * 90) * 3 : 0;
  h += `<g transform="translate(${shiver} 0)"><path d="${e.eyeL}" fill="${e.eyeFill}" stroke="${INK}" stroke-width="${e.eyeSW}" stroke-linecap="round"/><path d="${e.eyeR}" fill="${e.eyeFill}" stroke="${INK}" stroke-width="${e.eyeSW}" stroke-linecap="round"/></g>`;
  if (gog !== 'none') {
    const strap = down ? 'M84 188 L316 188' : 'M86 138 Q200 52 314 138';
    const gy = down ? 188 : 90, gl = down ? 165 : 163, gr = down ? 235 : 237, op = down ? 0.35 : 1;
    h += `<path d="${strap}" fill="none" stroke="#1F2D44" stroke-width="16" stroke-linecap="round"/>`;
    h += `<circle cx="${gl}" cy="${gy}" r="31" fill="${MINT}" fill-opacity="${op}" stroke="#1F2D44" stroke-width="9"/><circle cx="${gr}" cy="${gy}" r="31" fill="${MINT}" fill-opacity="${op}" stroke="#1F2D44" stroke-width="9"/>`;
    h += `<circle cx="${gl - 10}" cy="${gy - 10}" r="7" fill="#fff" opacity=".85"/><circle cx="${gr - 10}" cy="${gy - 10}" r="7" fill="#fff" opacity=".85"/>`;
  }
  h += `<path d="${e.browL}" fill="none" stroke="${INK}" stroke-width="13" stroke-linecap="round"/><path d="${e.browR}" fill="none" stroke="${INK}" stroke-width="13" stroke-linecap="round"/>`;
  h += `<path d="${e.mouth}" fill="${e.mouthFill}" stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (e.sweat || o.sweat) h += `<path d="M306 112 Q292 138 306 148 Q320 138 306 112 Z" fill="#9ED8FF" stroke="${INK}" stroke-width="5"/>`;
  h += `<circle cx="${p.hL[0]}" cy="${p.hL[1]}" r="22" fill="#fff" stroke="${INK}" stroke-width="7"/><circle cx="${p.hR[0]}" cy="${p.hR[1]}" r="22" fill="#fff" stroke="${INK}" stroke-width="7"/>`;
  h += `</g></g>`;
  return h;
}
const shadow = (x, y, w, op = 0.22) => `<ellipse cx="${x}" cy="${y}" rx="${w}" ry="${w * 0.14}" fill="#000" opacity="${op}"/>`;

/* ---------- THE DOCTOR (silhouette, face never shown) ---------- */
function doctor(x, y, s, glass = MINT, shake = 0) {
  return `<g transform="translate(${x + shake} ${y}) scale(${s})">
  <ellipse cx="-34" cy="-6" rx="34" ry="14" fill="#1F2D44" stroke="${INK}" stroke-width="6"/><ellipse cx="34" cy="-6" rx="34" ry="14" fill="#1F2D44" stroke="${INK}" stroke-width="6"/>
  <path d="M-96 -40 L-74 -540 Q0 -580 74 -540 L96 -40 Q0 -20 -96 -40 Z" fill="#E9EEF3" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/>
  <path d="M-24 -548 L0 -400 L24 -548 Z" fill="#1F2D44" stroke="${INK}" stroke-width="6"/>
  <line x1="0" y1="-400" x2="0" y2="-60" stroke="${INK}" stroke-width="5"/>
  <path d="M-72 -520 Q-118 -400 -112 -260" fill="none" stroke="${INK}" stroke-width="50" stroke-linecap="round"/><path d="M-72 -520 Q-118 -400 -112 -260" fill="none" stroke="#E9EEF3" stroke-width="36" stroke-linecap="round"/>
  <path d="M72 -520 Q118 -400 112 -260" fill="none" stroke="${INK}" stroke-width="50" stroke-linecap="round"/><path d="M72 -520 Q118 -400 112 -260" fill="none" stroke="#E9EEF3" stroke-width="36" stroke-linecap="round"/>
  <circle cx="-112" cy="-240" r="24" fill="#fff" stroke="${INK}" stroke-width="7"/><circle cx="112" cy="-240" r="24" fill="#fff" stroke="${INK}" stroke-width="7"/>
  <ellipse cx="0" cy="-668" rx="104" ry="98" fill="#1F2D44" stroke="${INK}" stroke-width="9"/>
  <circle cx="-38" cy="-670" r="27" fill="none" stroke="${glass}" stroke-width="7"/><circle cx="38" cy="-670" r="27" fill="none" stroke="${glass}" stroke-width="7"/>
  <line x1="-11" y1="-670" x2="11" y2="-670" stroke="${glass}" stroke-width="6"/>
  <line x1="-50" y1="-684" x2="-30" y2="-664" stroke="#fff" stroke-width="5" opacity=".8"/><line x1="26" y1="-684" x2="46" y2="-664" stroke="#fff" stroke-width="5" opacity=".8"/>
  </g>`;
}

/* ---------- text helpers (all SVG, outlined like Korean variety captions) ---------- */
function outlined(x, y, lines, o = {}) {
  const fs = o.size || 72, lh = o.lh || fs * 1.18, fill = o.fill || WHITE, stroke = o.stroke || INK, sw = o.sw || fs * 0.2;
  let h = '';
  lines.forEach((ln, i) => {
    const yy = y + i * lh;
    if (Array.isArray(ln)) {
      // segments [[text,color],...]
      let inner = ln.map(([tx, c]) => `<tspan fill="${c || fill}">${esc(tx)}</tspan>`).join('');
      h += `<text x="${x}" y="${yy}" text-anchor="${o.anchor || 'middle'}" font-family="${FONT}" font-weight="900" font-size="${fs}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" paint-order="stroke" fill="${fill}">${inner}</text>`;
    } else {
      h += `<text x="${x}" y="${yy}" text-anchor="${o.anchor || 'middle'}" font-family="${FONT}" font-weight="900" font-size="${fs}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" paint-order="stroke" fill="${fill}">${esc(ln)}</text>`;
    }
  });
  return h;
}
function pop(t, t0, t1, cx, cy, inner, o = {}) {
  if (t < t0 || t > t1) return '';
  const k = prog(t, t0, t0 + (o.inDur || 0.28));
  let sc = o.noPop ? 1 : lerp(0.2, 1, easeOutBack(k));
  const out = prog(t, t1 - 0.15, t1);
  const op = (o.noPop ? k : Math.min(1, k * 3)) * (1 - out);
  const rot = o.rot || 0;
  const wob = o.wobble ? Math.sin((t - t0) * 14) * o.wobble : 0;
  return `<g opacity="${op}" transform="translate(${cx} ${cy}) rotate(${rot + wob}) scale(${sc})">${inner}</g>`;
}
function burst(r, color, points = 14) {
  let d = '';
  for (let i = 0; i < points * 2; i++) {
    const a = Math.PI * i / points, rr = i % 2 ? r * 0.62 : r;
    d += (i ? 'L' : 'M') + (Math.cos(a) * rr).toFixed(1) + ' ' + (Math.sin(a) * rr * 0.72).toFixed(1);
  }
  return `<path d="${d}Z" fill="${color}" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>`;
}
function fx(t, t0, t1, x, y, text, color, o = {}) {
  const size = o.size || 130;
  let inner = '';
  if (o.burst) inner += burst(o.burst, o.burstColor || YEL);
  inner += outlined(0, size * 0.35, [text], { size, fill: color, sw: size * 0.16 });
  return pop(t, t0, t1, x, y, inner, { rot: o.rot || -6, wobble: o.wobble || 0 });
}
function tag(t, t0, t1, x, y, text, bg, o = {}) {
  const fs = o.size || 50, w = text.length * fs * 0.98 + 56, hgt = fs + 34;
  const inner = `<rect x="${-w / 2}" y="${-hgt / 2}" width="${w}" height="${hgt}" rx="${hgt / 2}" fill="${bg}" stroke="${INK}" stroke-width="6"/>
  <text x="0" y="${fs * 0.36}" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="${fs}" fill="${o.color || INK}">${esc(text)}</text>`;
  return pop(t, t0, t1, x, y, inner, { rot: o.rot || 4 });
}
// narration caption (bottom-centre, always readable)
function cap(t, t0, t1, lines, o = {}) {
  const y = o.y || 1330;
  return pop(t, t0, t1, 540, y, outlined(0, 0, lines, { size: o.size || 66, sw: 15 }), { noPop: true, inDur: 0.18 });
}
// the doctor's line in a lab-terminal box
function drBox(t, t0, t1, lines, o = {}) {
  if (t < t0 || t > t1) return '';
  const k = prog(t, t0, t0 + 0.2), out = prog(t, t1 - 0.15, t1);
  const y = o.y || 1190, fs = o.size || 50, lh = fs * 1.38, hgt = 70 + lines.length * lh;
  const n = (lines.join('').length);
  const shownChars = Math.floor(prog(t, t0, t0 + Math.min(1.4, n * 0.045)) * n);
  let used = 0;
  const shake = o.shake ? Math.sin(t * 60) * 4 : 0;
  let h = `<g opacity="${k * (1 - out)}" transform="translate(${shake} ${(1 - easeOut(k)) * 30})">`;
  h += `<rect x="70" y="${y}" width="940" height="${hgt}" rx="24" fill="${NAVY}" fill-opacity=".94" stroke="${o.border || MINT}" stroke-width="6"/>`;
  h += `<rect x="100" y="${y - 30}" width="150" height="60" rx="30" fill="${o.border || MINT}" stroke="${INK}" stroke-width="5"/>`;
  h += `<text x="175" y="${y + 12}" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="36" fill="${NAVY}">박사</text>`;
  lines.forEach((ln, i) => {
    const take = clamp(shownChars - used, 0, ln.length);
    used += ln.length;
    h += `<text x="110" y="${y + 70 + i * lh + fs * 0.25}" font-family="${FONT}" font-weight="700" font-size="${fs}" fill="#fff">${esc(ln.slice(0, take))}</text>`;
  });
  return h + `</g>`;
}
// top HUD like a lab readout
function hud(vals) {
  let h = '';
  const boxes = [['중력', vals.g, vals.gc], ['체중계', vals.w, vals.wc], ['경과', vals.d, vals.dc]];
  boxes.forEach(([lab, val, col], i) => {
    const x = 60 + i * 330;
    h += `<rect x="${x}" y="170" width="300" height="112" rx="18" fill="${NAVY}" fill-opacity=".86" stroke="${col || MINT}" stroke-width="4"/>`;
    h += `<text x="${x + 24}" y="210" font-family="${FONT}" font-weight="700" font-size="26" fill="${col || MINT}">${lab}</text>`;
    h += `<text x="${x + 24}" y="262" font-family="${FONT}" font-weight="900" font-size="46" fill="${col === RED ? RED : '#fff'}">${esc(val)}</text>`;
  });
  return h;
}
function speedLines(cx, cy, r0, r1, n, t, color = '#fff', op = 0.7) {
  let h = '';
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + Math.sin(i * 12.9) * 0.08;
    const j = (Math.sin(i * 7.3 + t * 30) + 1) * 0.5;
    const ra = r0 + j * 60;
    h += `<line x1="${cx + Math.cos(a) * ra}" y1="${cy + Math.sin(a) * ra}" x2="${cx + Math.cos(a) * r1}" y2="${cy + Math.sin(a) * r1}" stroke="${color}" stroke-width="${6 + (i % 3) * 4}" opacity="${op}"/>`;
  }
  return h;
}

/* ---------- backgrounds (webtoon flat colour) ---------- */
const DEFS = `<defs>

<pattern id="pave" width="100" height="60" patternUnits="userSpaceOnUse"><rect width="100" height="60" fill="#D9C7B0"/><path d="M100 0 L0 0 0 60" fill="none" stroke="#BFA78C" stroke-width="4"/></pattern>
</defs>`;

function labBG(t, o = {}) {
  let h = `<rect width="1080" height="1920" fill="url(#labG)"/><rect width="1080" height="1920" fill="url(#grid)"/>`;
  // monitors on the back wall
  [[90, 430, 280, 200], [400, 380, 300, 240], [730, 430, 280, 200]].forEach(([x, y, w, hh], i) => {

    scene += storeBG(t > 34.5 ? '놀람' : '기본');
    scene += shadow(zx, 1500, 80);
    if (t > 32.5 && t < 34.5) for (let i = 0; i < 5; i++) scene += `<line x1="${zx - 160 - i * 50}" y1="${1440 + i * 14}" x2="${zx - 60 - i * 40}" y2="${1440 + i * 14}" stroke="${INK}" stroke-width="7" stroke-linecap="round" opacity=".7"/>`;
    scene += zero({ x: zx, y: 1490, s: 0.78, pose, expr, sx: sxq, sy: t > 34.5 ? 0.94 : 1, rot, goggles: 'up', sweat: t > 32.5 && t < 34.5 });
    if (t > 34.5 && t < 35.2) scene += speedLines(640, 1100, 200, 560, 20, t, INK, 0.55);
    [sx, sy] = shakeAt(t, 34.5, 0.5, 30);
    hudV = { g: '0.17 G', w: '10.0 kg', d: '1일차' };
    over += cap(t, 30.1, 32.4, ['문제는…', '멈출 때다']);
    over += fx(t, 32.5, 34.4, 330, 1150, '끼이이익~', '#fff', { size: 92, rot: -4, wobble: 4 });
    over += fx(t, 34.5, 36.0, 640, 880, '쾅!', YEL, { size: 190, burst: 200, burstColor: '#FF8A3D', rot: 6 });
    over += cap(t, 34.9, 36.9, [[['브레이크도 ', WHITE], ['6분의 1', YEL]]]);
    over += tag(t, 35.3, 36.9, 760, 1520, '(마찰력 실종)', PINK, { rot: -5 });
    cam = punch(t, 30);
  } else if (t < 46) {
    // S6 rooftop fall: 3.5 s from 39.0 to 42.5
    const f = prog(t, 39.0, 42.5);
    const zyW = t < 39 ? 1210 : lerp(1210, 3440, f * f);
    const camY = clamp(zyW - 1150, 0, 3500 - 1500);
    scene += `<g transform="translate(0 ${-camY})">${rooftopWorld(t)}`;
    if (t >= 42.5) scene += shadow(540, 3446, 70);
    scene += zero({ x: 540, y: zyW, s: 0.74, pose: t < 39 ? '서기' : (t < 42.5 ? '둥둥' : '손인사'), expr: t < 39 ? '결심' : (t < 42.5 ? '기본' : '신남') });
    scene += `</g>`;
    if (t > 38.6 && t < 39.0) scene += zero({ x: 220, y: 1500, s: 0.5, expr: '겁먹음', goggles: 'none', vest: '#A8705D', patch: false, hair: '#3A2A1A', pose: '손인사' });
    hudV = { g: '0.17 G', w: '10.0 kg', d: '1일차' };
    over += cap(t, 37.1, 38.9, ['점심시간 옥상,', '10m 아래로…']);
    over += cap(t, 39.1, 42.4, ['천천히… 아주 천천히']);
    if (t > 39 && t < 42.6) over += outlined(860, 900, ['낙하', (Math.min(3.5, t - 39)).toFixed(1) + '초'], { size: 64, fill: MINT, sw: 14 });
    over += fx(t, 42.5, 44.0, 540, 1040, '사뿐~', MINT, { size: 110, rot: -6 });
    over += tag(t, 42.8, 44.1, 760, 1160, '(슈퍼히어로?!)', YEL, { rot: 5 });
    over += drBox(t, 44.1, 45.9, ['오늘은 괜찮습니다.', '…오늘은요.'], { y: 640 });
    cam = punch(t, 37);
  } else if (t < 51.5) {
    // S7 day 7 bone scan
    scene += labBG(t) + `<g transform="translate(108 -40) scale(0.8)">${boneMonitor(t)}</g>`;
    scene += doctor(180, 1600, 0.45);
    scene += zero({ x: 820, y: 1560, s: 0.62, expr: '걱정', pose: '서기' });
    hudV = { g: '0.17 G', w: '10.0 kg', d: '7일차' };
    over += pop(t, 46.0, 47.0, 540, 1000, outlined(0, 0, ['7일차'], { size: 150, fill: YEL, sw: 26 }), {});
    over += drBox(t, 47.0, 51.4, ['우주정거장에선 한 달에 골밀도가', '1~1.5% 줄어듭니다.', '6분의 1 중력은? 아직 아무도 몰라요.'], { size: 46, y: 900 });
    cam = punch(t, 46);
  } else if (t < 57) {
    // S8 twist
    const alert = t > 54.2;
    const v = t < 53.8 ? 10 : lerp(10, 5, easeInOut(prog(t, 53.8, 55.2)));
    const float = easeInOut(prog(t, 55.0, 57.0)) * 260;
    scene += labBG(t, { alert }) + platform(560, 1440, 0.3);
    scene += scale(560, 1420, v.toFixed(1) + 'kg', alert ? RED : YEL);
    scene += doctor(170, 1560, 0.5, alert ? RED : MINT, alert ? Math.sin(t * 40) * 3 : 0);
    scene += shadow(560, 1410, 80 - float * 0.2);
    scene += zero({ x: 560, y: 1390 - float, s: 0.72, pose: float > 10 ? '둥둥' : '서기', expr: t < 54.2 ? '신남' : '겁먹음', goggles: 'up', shiver: alert ? t : 0 });
    if (alert) {
      const fl = (Math.sin(t * 12) + 1) / 2;
      scene += `<rect width="1080" height="1920" fill="${RED}" opacity="${0.1 + fl * 0.18}"/><circle cx="540" cy="360" r="320" fill="url(#redglow)" opacity="${fl}"/>`;
    }
    const g = t < 54.2 ? 0.17 : lerp(0.17, 0.08, prog(t, 54.2, 55.4));
    hudV = { g: g.toFixed(2) + ' G', gc: alert ? RED : MINT, w: v.toFixed(1) + ' kg', wc: alert ? RED : MINT, d: '7일차' };
    over += drBox(t, 51.6, 53.6, ['실험 종료. 중력 복구.'], { y: 700 });
    over += cap(t, 53.0, 54.2, ['휴, 이제 끝…?']);
    over += fx(t, 54.3, 57.0, 300, 560, '삐- 삐-', RED, { size: 96, rot: -8, wobble: 5 });
    over += drBox(t, 55.2, 57.0, ['저는… 설정값을 바꾼 적이', '없습니다.'], { border: RED, shake: true, y: 700 });
    cam = 1 + prog(t, 54.2, 57) * 0.06;
  } else {
    // S9 end card
    scene += `<rect width="1080" height="1920" fill="${NAVY}"/><rect width="1080" height="1920" fill="url(#grid)"/>`;
    const fl = Math.sin(t * 3) * 14;
    scene += zero({ x: 540, y: 1080 + fl, s: 0.5, pose: '둥둥', expr: '겁먹음', goggles: 'down' });
    over += pop(t, 57.0, 60.1, 540, 430, outlined(0, 0, [[['실험 001 · ', MINT], ['2부', YEL]]], { size: 70, sw: 14 }), {});
    over += pop(t, 57.2, 60.1, 540, 1260, outlined(0, 0, ['중력이 매일', [['절반씩', YEL], [' 줄어든다면?', WHITE]]], { size: 92, sw: 18 }), {});
    over += pop(t, 57.8, 60.1, 540, 1530, `<rect x="-400" y="-56" width="800" height="104" rx="52" fill="${MINT}" stroke="${INK}" stroke-width="6"/><text x="0" y="16" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="46" fill="${NAVY}">다음 실험은 댓글로 의뢰하세요</text>`, {});
  }

  // global fade at very start / end
  const fadeIn = 1 - prog(t, 0, 0.25);
  const out = `<g transform="translate(${540 + sx} ${960 + sy}) scale(${cam}) translate(-540 -960)">${scene}</g>
  ${t < 57 ? hud(hudV) : ''}
  ${over}
  <text x="1040" y="1880" text-anchor="end" font-family="${FONT}" font-weight="700" font-size="28" fill="#fff" opacity=".55">만약에연구소</text>
  <rect width="1080" height="1920" fill="#000" opacity="${fadeIn}"/>`;
  document.getElementById('v').innerHTML = DEFS + out;
}
window.render = render;
render(0);
</script>
</body>
</html>
